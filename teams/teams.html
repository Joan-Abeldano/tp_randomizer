<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Team Randomizer</title>
	<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
	<header class="app-header">
		<a class="btn btn-secondary btn-sm" href="../index.html">Back to randomizers</a>
		<h1>Team Randomizer</h1>
		<p class="subtitle">Shuffle team ratings and attributes.</p>
	</header>

	<section class="card upload-card">
		<div id="dropZone" class="drop-zone">
			<div class="drop-zone-inner">
				<div class="drop-icon">+</div>
				<p><strong>Click to upload</strong> or drag &amp; drop a teams JSON file</p>
			</div>
			<input type="file" id="fileInput" accept=".json,application/json" hidden>
		</div>
		<div id="uploadStatus" class="status" role="status" aria-live="polite"></div>
	</section>

	<main id="mainPanel" class="panel" style="display:none;">
		<section class="card">
			<div class="section-header">
				<h2>Randomization Options</h2>
				<div class="section-actions">
					<button id="randomizeBtn" class="btn btn-primary" disabled>Randomize</button>
					<button id="resetBtn" class="btn btn-danger" disabled>Reset</button>
				</div>
			</div>
			<div class="options-grid">
				<label class="opt"><input type="checkbox" id="randomizeStats"> <span>Randomize stats (1-100)</span></label>
				<label class="opt stat-range-opt"><input type="checkbox" id="randomizeStatsRange"> <span>Randomize stats</span><span>from</span><input type="number" id="statsRangeMin" min="1" max="100" value="1" aria-label="Minimum randomized stat"><span>to</span><input type="number" id="statsRangeMax" min="1" max="100" value="100" aria-label="Maximum randomized stat"></label>
				<label class="opt"><input type="checkbox" id="statsNearOriginal"> <span>Stats +/-</span><input type="number" id="statsVariation" min="0" max="99" value="10" aria-label="Stats variation from original"><span>from original</span></label>
				<label class="opt"><input type="checkbox" id="randomizePotential"> <span>Randomize starting potential (1-100)</span></label>
				<label class="opt"><input type="checkbox" id="potentialNearOriginal"> <span>Potential +/-</span><input type="number" id="potentialVariation" min="0" max="99" value="10" aria-label="Potential variation from original"><span>from original</span></label>
				<label class="opt"><input type="checkbox" id="randomizeFinance"> <span>Randomize budget and balance</span></label>
				<label class="opt"><input type="checkbox" id="randomizeHeadquarters"> <span>Randomize headquarters</span></label>
				<label class="opt"><input type="checkbox" id="randomizeActiveTeams"> <span>Randomize active teams</span><input type="number" id="activeTeamCount" min="0" step="1" value="1" aria-label="Number of active teams"></label>
			</div>
			<p class="hint">Potential stays at or above its matching stat. +/- modes use values from the uploaded file.</p>
		</section>
	</main>

	<section id="resultPanel" class="panel" style="display:none;">
		<div class="card">
			<div class="section-header">
				<h2 id="resultHeading">Randomized Teams</h2>
				<div class="section-actions">
					<label class="result-visibility"><input type="checkbox" id="showResultTable" aria-controls="resultTable"> <span>Show result table</span></label>
					<button id="downloadBtn" class="btn btn-primary" disabled>Download JSON</button>
				</div>
			</div>
			<div id="reportBox" class="report-box"></div>
			<div id="resultTable" hidden></div>
		</div>
	</section>

	<footer class="app-footer"><p>By G4llet4</p></footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="../shared/fileHandler.js"></script>
<script src="js/teamData.js"></script>
<script src="js/randomizer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
