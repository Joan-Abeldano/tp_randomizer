<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Stats Randomizer</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
    <header class="app-header">
        <h1>Driver Stats Randomizer</h1>
        <p class="subtitle">Upload a drivers JSON, configure randomization, download result.</p>
    </header>

    <section class="card upload-card">
        <div id="dropZone" class="drop-zone">
            <div class="drop-zone-inner">
                <div class="drop-icon">+</div>
                <p><strong>Click to upload</strong> or drag &amp; drop a drivers JSON file</p>
            </div>
            <input type="file" id="fileInput" accept=".json,application/json" hidden>
        </div>
        <div id="uploadStatus" class="status"></div>
    </section>

    <main id="mainPanel" class="panel" style="display:none;">
        <section class="card">
            <div class="section-header">
                <h2>Randomization Options</h2>
                <div class="section-actions">
                    <button id="randomizeBtn" class="btn btn-primary" disabled>Randomize</button>
                    <button id="downloadOriginalBtn" class="btn btn-secondary" disabled>Download Original</button>
                    <button id="resetBtn" class="btn btn-danger" disabled>Reset</button>
                </div>
            </div>
            <div class="options-grid">
                <label class="opt"><input type="checkbox" id="optPerAge"> <span>Per-age stat randomization</span></label>
                <label class="opt"><input type="checkbox" id="optTraits"> <span>Randomize traits</span></label>
                <label class="opt"><input type="checkbox" id="optPersonalities"> <span>Randomize personalities</span></label>
                <label class="opt"><input type="checkbox" id="optZeroHistory"> <span>Set history to zeros</span></label>
                <label class="opt"><input type="checkbox" id="optBalance"> <span>Randomize balance_preference</span></label>
                <label class="opt"><input type="checkbox" id="optTraction"> <span>Randomize traction_preference</span></label>
                <label class="opt"><input type="checkbox" id="optTalent"> <span>Randomize talent</span></label>
                <label class="opt"><input type="checkbox" id="optTalentNear"> <span>Randomize talent +-</span><input type="number" id="talentVariation" min="0" max="98" step="1" value="10" aria-label="Talent variation in points"><span>from original</span></label>
                <label class="opt"><input type="checkbox" id="optClearContracts"> <span>Clear contracts</span></label>
            </div>

            <div id="ageBracketsSection" class="age-section" style="display:none;">
                <div class="section-header">
                    <h3>Age Brackets</h3>
                    <div class="section-actions">
                        <button id="addBracketBtn" class="btn btn-secondary btn-sm">+ Add bracket</button>
                        <button id="resetBracketsBtn" class="btn btn-secondary btn-sm">Reset</button>
                    </div>
                </div>
                <p class="hint">Configure min/max stat ranges per age bracket. Stats: 1-20. Talent: 1-99.</p>
                <div id="ageBrackets" class="brackets-list"></div>
            </div>
        </section>
    </main>

    <section id="resultPanel" class="panel" style="display:none;">
        <div class="card">
            <div class="section-header">
                <h2>Randomized Result</h2>
                <div class="section-actions">
                    <button id="downloadBtn" class="btn btn-primary" disabled>Download JSON</button>
                </div>
            </div>
            <div id="reportBox" class="report-box"></div>
            <div id="resultTable"></div>
        </div>
    </section>

    <footer class="app-footer">
        <p>By G4llet4</p>
    </footer>
</div>

<div id="toast" class="toast"></div>

<script src="js/traitsData.js"></script>
<script src="js/ageConfig.js"></script>
<script src="js/fileHandler.js"></script>
<script src="js/randomizer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
