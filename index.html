<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP Randomizer</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <a class="skip-link" href="#tools">Skip to randomizers</a>
    <div class="page-shell">
        <header class="site-header">
        </header>

        <main>
            <section class="intro" aria-labelledby="page-title">
                <h1 id="page-title">TP Randomizer</h1>
                <p class="intro-copy">Choose a randomizer</p>
            </section>

            <section class="tool-grid" id="tools" aria-label="Available randomizers">
                <article class="tool-card driver-card">
                    <div class="card-meta">
                        <span class="tool-number">01</span>
                    </div>
                    <div class="tool-content">
                        <h2>Drivers</h2>
                    </div>
                    <div class="card-bottom">
                        <span class="file-label">DRIVERS.JSON</span>
                        <a class="tool-link" href="drivers/drivers.html">
                            <span>Open randomizer</span><span class="link-arrow" aria-hidden="true">&rarr;</span>
                        </a>
                    </div>
                </article>

                <article class="tool-card team-card">
                    <div class="card-meta">
                        <span class="tool-number">02</span>
                    </div>
                    <div class="tool-content">
                        <h2>Teams</h2>
                    </div>
                    <div class="card-bottom">
                        <span class="file-label">TEAMS.JSON</span>
                        <a class="tool-link" href="teams/teams.html">
                            <span>Open randomizer</span><span class="link-arrow" aria-hidden="true">&rarr;</span>
                        </a>
                    </div>
                </article>

                <article class="tool-card staff-card">
                    <div class="card-meta">
                        <span class="tool-number">03</span>
                    </div>
                    <div class="tool-content">
                        <h2>Staff</h2>
                    </div>
                    <div class="card-bottom">
                        <span class="file-label">STAFF.JSON</span>
                        <a class="tool-link" href="staff/staff.html">
                            <span>Open randomizer</span><span class="link-arrow" aria-hidden="true">&rarr;</span>
                        </a>
                    </div>
                </article>

                <article class="tool-card engine-card">
                    <div class="card-meta">
                        <span class="tool-number">04</span>
                    </div>
                    <div class="tool-content">
                        <h2>Engines</h2>
                    </div>
                    <div class="card-bottom">
                        <span class="file-label">ENGINES.JSON</span>
                        <a class="tool-link" href="engines/engines.html">
                            <span>Open randomizer</span><span class="link-arrow" aria-hidden="true">&rarr;</span>
                        </a>
                    </div>
                </article>
            </section>
        </main>

        <footer class="site-footer">
            <span>TP RANDOMIZER</span>
            <span>By G4llet4</span>
        </footer>
    </div>
</body>
</html>
